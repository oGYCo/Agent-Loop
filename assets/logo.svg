<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    
    <linearGradient id="gradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D69E2E" />
      <stop offset="50%" stop-color="#ECC94B" />
      <stop offset="100%" stop-color="#F6E05E" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="transparent" />

  <g transform="translate(400, 240)">
    <g filter="url(#shadow)">
      
      <!-- Back/Left Pillar -->
      <path d="M -70 20 L -20 -10 L -20 -80 L -70 -50 Z" fill="#718096" />
      
      <!-- Back/Right Pillar -->
      <path d="M 70 20 L 20 -10 L 20 -80 L 70 -50 Z" fill="#A0AEC0" />

      <!-- Top Bridge -->
      <path d="M -20 -80 L 0 -95 L 70 -50 L 50 -35 Z" fill="#CBD5E0" />
      <path d="M -70 -50 L -50 -35 L 20 -80 Z" fill="#E2E8F0" />

      <!-- Left Lower Bridge -->
      <path d="M -70 -50 L -90 -35 L -40 0 L -20 -15 Z" fill="#4A5568" />
      <path d="M -70 20 L -90 5 L -40 -30 L -20 -15 Z" fill="#2D3748" />

      <!-- Right Lower Bridge -->
      <path d="M 70 -50 L 90 -35 L 40 0 L 20 -15 Z" fill="#E2E8F0" />
      <path d="M 70 20 L 90 5 L 40 -30 L 20 -15 Z" fill="#EDF2F7" />

      <!-- Front Crossing Pillar (The Accent/Agent Loop) -->
      <path d="M -40 0 L 0 25 L 40 0 L 0 -25 Z" fill="url(#gradAccent)" />
      <path d="M -40 0 L 0 25 L 0 85 L -40 60 Z" fill="#B7791F" />
      <path d="M 40 0 L 0 25 L 0 85 L 40 60 Z" fill="#D69E2E" />

      <!-- Front Left Connection -->
      <path d="M -70 20 L -40 40 L -40 100 L -70 80 Z" fill="url(#gradPrimary)" />
      <path d="M -40 40 L 0 65 L 0 125 L -40 100 Z" fill="#1A202C" />

      <!-- Front Right Connection -->
      <path d="M 70 20 L 40 40 L 40 100 L 70 80 Z" fill="#A0AEC0" />
      <path d="M 40 40 L 0 65 L 0 125 L 40 100 Z" fill="#718096" />

    </g>
  </g>

  <g transform="translate(400, 480)" text-anchor="middle">
    <text x="-3" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#1A202C" letter-spacing="-1">
      Agent<tspan fill="#D69E2E">Loop</tspan>
    </text>
    <text x="0" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#718096" letter-spacing="4" textLength="220" lengthAdjust="spacingAndGlyphs">
      AUTONOMOUS AI SYSTEM
    </text>
  </g>
</svg>