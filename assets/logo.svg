<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="120" rx="16" fill="#0f0f1a"/>

  <!-- Large stylized A -->
  <g transform="translate(30, 15)" filter="url(#glow)">
    <path d="M35 0 L70 90 L62 90 L54 70 L16 70 L8 90 L0 90 Z M35 15 L23 55 L47 55 Z"
          fill="url(#grad)"/>
  </g>

  <!-- Text -->
  <text x="110" y="72" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="white">gent</text>
  <text x="110" y="72" font-family="system-ui, sans-serif" font-size="42" font-weight="300" fill="url(#grad)">L</text><text x="145" y="72" font-family="system-ui, sans-serif" font-size="42" font-weight="300" fill="white">oop</text>

  <!-- Subtitle -->
  <text x="280" y="65" font-family="monospace" font-size="11" fill="#00d4ff" letter-spacing="2" opacity="0.8">AUTONOMOUS</text>
  <text x="280" y="85" font-family="monospace" font-size="11" fill="#a855f7" letter-spacing="1" opacity="0.8">AGENT SYSTEM</text>
</svg>
