<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>

    <!-- Primary accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>

    <!-- Secondary gradient -->
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.6"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.4"/>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="600" height="150" rx="20" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="30" x2="600" y2="30" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="600" y2="60" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="600" y2="90" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="150" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="150" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="150" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="150" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="150" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Outer decorative ring -->
  <circle cx="75" cy="75" r="50" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="50;55;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.15;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Middle decorative ring -->
  <circle cx="75" cy="75" r="38" fill="none" stroke="url(#ringGrad)" stroke-width="1.2" opacity="0.4">
    <animate attributeName="r" values="38;42;38" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner decorative ring -->
  <circle cx="75" cy="75" r="28" fill="none" stroke="url(#ringGrad)" stroke-width="0.8" opacity="0.5">
    <animate attributeName="r" values="28;32;28" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Robot icon container -->
  <g filter="url(#shadow)">
    <!-- Robot head -->
    <rect x="50" y="45" width="50" height="45" rx="10" fill="url(#accentGrad)" filter="url(#glow)"/>

    <!-- Robot face plate -->
    <rect x="55" y="50" width="40" height="35" rx="6" fill="#0f0f23" opacity="0.9"/>

    <!-- Left eye -->
    <circle cx="65" cy="62" r="5" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="r" values="5;4;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="65" cy="62" r="2" fill="#ffffff"/>

    <!-- Right eye -->
    <circle cx="85" cy="62" r="5" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="r" values="5;4;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="62" r="2" fill="#ffffff"/>

    <!-- Antenna -->
    <line x1="75" y1="45" x2="75" y2="30" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="75" cy="26" r="4" fill="#00d4ff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Mouth line -->
    <rect x="62" y="75" width="26" height="3" rx="1.5" fill="#00ff88" opacity="0.8">
      <animate attributeName="width" values="26;20;26" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Data flow arrows -->
  <g stroke="url(#accentGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#glow)">
    <path d="M135 65 L160 65">
      <animate attributeName="stroke-dasharray" values="0,25;25,0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M135 85 L160 85">
      <animate attributeName="stroke-dasharray" values="0,25;25,0" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </path>
  </g>

  <!-- Arrow heads -->
  <polygon points="163,65 155,60 155,70" fill="#00ff88" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="163,85 155,80 155,90" fill="#7c3aed" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1s" repeatCount="indefinite" begin="0.3s"/>
  </polygon>

  <!-- Processing dots -->
  <circle cx="175" cy="65" r="3" fill="#00d4ff" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="65" r="3" fill="#00ff88" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="195" cy="65" r="3" fill="#7c3aed" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- Main title -->
  <text x="220" y="70" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="36" font-weight="700" fill="white" filter="url(#textGlow)">Agent</text>
  <text x="220" y="105" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="36" font-weight="300" fill="url(#accentGrad)" filter="url(#textGlow)">Loop</text>

  <!-- Tagline -->
  <text x="350" y="65" font-family="'SF Mono', 'Monaco', monospace" font-size="12" fill="#00d4ff" opacity="0.9" letter-spacing="2">AUTONOMOUS</text>
  <text x="350" y="85" font-family="'SF Mono', 'Monaco', monospace" font-size="12" fill="#7c3aed" opacity="0.9" letter-spacing="1">AI AGENT SYSTEM</text>

  <!-- Version badge -->
  <rect x="485" y="55" width="50" height="20" rx="10" fill="url(#accentGrad)" opacity="0.2"/>
  <text x="510" y="69" font-family="'SF Mono', 'Monaco', monospace" font-size="10" fill="#00ff88" text-anchor="middle" opacity="0.9">v2.0</text>

  <!-- Decorative corner accents -->
  <g stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <path d="M10 30 L10 10 L30 10" fill="none"/>
    <path d="M570 120 L570 140 L590 140" fill="none"/>
  </g>
</svg>
