<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" rx="16" fill="url(#bgGrad)"/>

  <!-- Decorative rings -->
  <circle cx="60" cy="60" r="35" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.4">
    <animate attributeName="r" values="35;38;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.2;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="25" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="25;28;25" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Core bot icon -->
  <g filter="url(#shadow)">
    <!-- Bot head -->
    <rect x="40" y="35" width="40" height="35" rx="8" fill="url(#accentGrad)"/>

    <!-- Eyes -->
    <circle cx="52" cy="48" r="4" fill="#1a1a2e">
      <animate attributeName="r" values="4;3;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="48" r="4" fill="#1a1a2e">
      <animate attributeName="r" values="4;3;4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Antenna -->
    <line x1="60" y1="35" x2="60" y2="25" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="22" r="3" fill="#00d4ff">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Data flow lines -->
  <g stroke="url(#accentGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M95 50 L120 50">
      <animate attributeName="stroke-dasharray" values="0,25;25,0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M95 70 L120 70">
      <animate attributeName="stroke-dasharray" values="0,25;25,0" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </path>
  </g>

  <!-- Processing dots -->
  <circle cx="130" cy="50" r="2" fill="#00d4ff">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="70" r="2" fill="#7c3aed">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- Text -->
  <text x="155" y="58" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="white" filter="url(#shadow)">Agent</text>
  <text x="155" y="82" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="28" font-weight="300" fill="url(#accentGrad)" filter="url(#shadow)">Loop</text>

  <!-- Subtitle -->
  <text x="260" y="65" font-family="'SF Mono', 'Monaco', monospace" font-size="11" fill="#00d4ff" opacity="0.8">autonomous</text>
  <text x="260" y="82" font-family="'SF Mono', 'Monaco', monospace" font-size="11" fill="#7c3aed" opacity="0.8">AI agent system</text>
</svg>
