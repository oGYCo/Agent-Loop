<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <!-- 主渐变 - 科技蓝紫 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>

    <!-- 辅助渐变 - 青色点缀 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>

    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 柔和阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="100" rx="16" fill="#0a0a0f"/>

  <!-- 装饰性背景网格 -->
  <g opacity="0.08">
    <line x1="0" y1="20" x2="400" y2="20" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="400" y2="50" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="400" y2="80" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="100" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="100" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="100" stroke="#3b82f6" stroke-width="0.5"/>
  </g>

  <!-- 图标: 抽象的 A + 循环符号 -->
  <g transform="translate(24, 16)" filter="url(#glow)">
    <!-- 外圈环 -->
    <circle cx="34" cy="34" r="30" fill="none" stroke="url(#mainGrad)" stroke-width="3" opacity="0.9"/>
    <!-- 内圈环 - 断开设计 -->
    <path d="M34 12 A22 22 0 0 1 52 45" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 45 A22 22 0 0 1 34 12" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- 中心 A 符号 -->
    <path d="M20 54 L34 20 L48 54 M26 44 L42 44"
          fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 主文字: AgentLoop -->
  <g filter="url(#shadow)">
    <text x="108" y="58" font-family="'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif" font-size="38" font-weight="700" fill="white" letter-spacing="-0.5">Agent</text>
    <text x="218" y="58" font-family="'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif" font-size="38" font-weight="300" fill="url(#mainGrad)" letter-spacing="-0.5">Loop</text>
  </g>

  <!-- 装饰点 -->
  <circle cx="202" cy="42" r="3" fill="url(#accentGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 底部标签 -->
  <g transform="translate(108, 78)">
    <rect x="0" y="0" width="72" height="16" rx="4" fill="url(#mainGrad)" opacity="0.15"/>
    <text x="36" y="12" font-family="'SF Mono', 'Monaco', monospace" font-size="9" font-weight="500" fill="url(#mainGrad)" text-anchor="middle" letter-spacing="1.5">AUTONOMOUS</text>
  </g>
</svg>
